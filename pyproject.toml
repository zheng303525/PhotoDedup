[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photodedup"
version = "1.0.0"
description = "Recursively scan a folder for duplicate photos, confirm them pair by pair, keep the best copy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Victo", email = "victor.zheng@outlook.com" }]
keywords = ["deduplication", "photos", "images", "phash", "opencv", "pyside6", "desktop"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "PySide6-Essentials>=6.7",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.3",
    "pillow-heif>=0.17",
    "Send2Trash>=1.8",
]

[project.urls]
Homepage = "https://github.com/zheng303525/PhotoDedup"
Issues = "https://github.com/zheng303525/PhotoDedup/issues"
Changelog = "https://github.com/zheng303525/PhotoDedup/releases"

[project.scripts]
photodedup = "photodedup.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
